 data-entity-2="part4" id="msg3"><polygon fill="#1A6FA8" points="1248.4648,321.2891,1258.4648,325.2891,1248.4648,329.2891,1252.4648,325.2891" style="stroke:#1A6FA8;stroke-width:1;"/><line style="stroke:#1A6FA8;stroke-width:1;" x1="782.3091" x2="1254.4648" y1="325.2891" y2="325.2891"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="454.1558" x="789.3091" y="320.4326">ResearchRequest + AgentRun(Researcher, OnDemand, Queued, high priority)</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg4"><polygon fill="#1A6FA8" points="487.124,351.6406,477.124,355.6406,487.124,359.6406,483.124,355.6406" style="stroke:#1A6FA8;stroke-width:1;"/><line style="stroke:#1A6FA8;stroke-width:1;stroke-dasharray:2,2;" x1="481.124" x2="781.3091" y1="355.6406" y2="355.6406"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="44.1035" x="493.124" y="350.7842">202 {id}</text></g><path d="M481,372.6406 L481,423.6406 A4,4 0 0 0 485,427.6406 L689,427.6406 A4,4 0 0 0 693,423.6406 L693,378.6406 L683,368.6406 L485,368.6406 A4,4 0 0 0 481,372.6406" fill="#FFFDE7" style="stroke:#F0A500;stroke-width:0.5;"/><path d="M683,368.6406 L683,376.6406 A2,2 0 0 0 685,378.6406 L693,378.6406 L683,368.6406" fill="#FFFDE7" style="stroke:#F0A500;stroke-width:0.5;"/><text fill="#5D4037" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.5234" x="487" y="387.1357">From here the page polls</text><text fill="#5D4037" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.8452" x="487" y="403.4873">GET /api/research/{id} every ~2 s</text><text fill="#5D4037" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.6099" x="487" y="419.8389">(streaming can come later)</text><rect fill="#EEEEEE" height="3" rx="4" ry="4" style="stroke:#EEEEEE;stroke-width:1;" width="2256.1982" x="0" y="453.8711"/><line style="stroke:#000000;stroke-wid