roke:#2E7D32;stroke-width:1.5;" width="123.7285" x="986.37" y="440"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="56.0566" x="1020.2059" y="457.457">&#171;planned&#187;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="84.4824" x="1005.993" y="470.4746">ResearchRequest</text><line style="stroke:#2E7D32;stroke-width:1.5;" x1="987.37" x2="1109.0985" y1="477.6719" y2="477.6719"/><text fill="#000000" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="34.4629" x="992.37" y="492.0527">id: Guid</text><text fill="#000000" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="69.4873" x="992.37" y="504.6309">question: String</text><text fill="#000000" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="103.3936" x="992.37" y="517.209">scope: ResearchScope</text><text fill="#000000" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="111.7285" x="992.37" y="529.7871">scopeEntityId: Guid [0..1]</text><text fill="#000000" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="88.9307" x="992.37" y="542.3652">answer: String [0..1]</text><text fill="#000000" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="67.832" x="992.37" y="554.9434">abstained: bool</text><text fill="#000000" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="91.7041" x="992.37" y="567.5215">createdAt: DateTime</text></g><g class="entity" data-qualified-name="GMN57" data-source-line="237" id="ent0058"><path d="M1239.37,1837 L1239.37,1872.9609 A4,4 0 0 0 1243.37,1876.9609 L1411.4442,1876.9609 A4,4 0 0 0 1415.4442,1872.9609 L1415.4442,1843 L1405.4442,1833 L1331.37,1833 L1327.37,1686.91 L1323.37,1833 L1243.37,1833 A4,4 0 0 0 1239.37,1837" fill="#E8F5E9" style="stroke:#F0A500;stroke-width:0.5;"/><path d="M1405.4442,1833 L1405.4442,1841 A2,2 0 0 0 1407.4442,1843 L1415.4442,1843 L1405.4442,1833" fill="#E8F5E9" style="stroke:#F0A500;stroke-width:0.5;"/><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="155.0742" x="1245.37" y="1847.3428">Not implemented yet (needs pgvector):</text><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="100.0591" x="1245.37" y="1858.6631">embedding: vector(1024)</text><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="97.5586" x="1245.37" y="1869.9834">embeddingModel: String</text></g><g class="entity" data-qualified-name="GMN69" data-source-line="288" id="ent0070"><path d="M1518.37,1342 L1518.37,1423.2422 A4,4 0 0 0 1522.37,1427.2422 L1754.4725,1427.2422 A4,4 0 0 0 1758.4725,1423.2422 L1758.4725,1348 L1748.4725,1338 L1672.64,1338 L1795.92,1153.42 L1664.64,1338 L1522.37,1338 A4,4 0 0 0 1518.37,1342" fill="#FFFDE7" style="stroke:#F0A500;stroke-width:0.5;"/><path d="M1748.4725,1338 L1748.4725,1346 A2,2 0 0 0 1750.4725,1348 L1758.4725,1348 L1748.4725,1338" fill="#FFFDE7" style="stroke:#F0A500;stroke-width:0.5;"/><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="163.481" x="1524.37" y="1352.3428">kind is the tag that picks the "apply" step:</text><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="219.1025" x="1524.37" y="1363.6631">NewCulture, NewProcedure and NewResource call the</text><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="207.1099" x="1524.37" y="1374.9834">existing Create services; the two Link kinds add one</text><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="136.5688" x="1524.37" y="1386.3037">association to what already exists.</text><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="156.5771" x="1524.37" y="1397.624">payload is the DTO of that call, as json.</text><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="213.1392" x="1524.37" y="1408.9443">Accepting a Suggestion changes catalogue rows only</text><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="116.5605" x="1524.37" y="1420.2646">through the existing services.</text></g><g class="entity" data-qualified-name="GMN72" data-source-line="298" id="ent0073"><path d="M1741.37,1633.5 L1741.37,1658.1406 A4,4 0 0 0 1745.37,1662.1406 L1957.7015,1662.1406 A4,4 0 0 0 1961.7015,1658.1406 L1961.7015,1639.5 L1951.7015,1629.5 L1855.37,1629.5 L1851.37,1410.5 L1847.37,1629.5 L1745.37,1629.5 A4,4 0 0 0 1741.37,1633.5" fill="#FFFDE7" style="stroke:#F0A500;stroke-width:0.5;"/><path d="M1951.7015,1629.5 L1951.7015,1637.5 A2,2 0 0 0 1953.7015,1639.5 L1961.7015,1639.5 L1951.7015,1629.5" fill="#FFFDE7" style="stroke:#F0A500;stroke-width:0.5;"/><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="199.3315" x="1747.37" y="1643.8428">Mandatory. quote must appear in the chunk's text,</text><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="161.6001" x="1747.37" y="1655.1631">checked before the suggestion is stored.</text></g><g class="entity" data-qualified-name="GMN75" data-source-line="303" id="ent0076"><path d="M2241.37,1049.5 L2241.37,1058 L2205.98,1062 L2241.37,1066 L2241.37,1074.1406 A4,4 0 0 0 2245.37,1078.1406 L2411.4535,1078.1406 A4,4 0 0 0 2415.4535,1074.1406 L2415.4535,1055.5 L2405.4535,1045.5 L2245.37,1045.5 A4,4 0 0 0 2241.37,1049.5" fill="#E8F5E9" style="stroke:#F0A500;stroke-width:0.5;"/><path d="M2405.4535,1045.5 L2405.4535,1053.5 A2,2 0 0 0 2407.4535,1055.5 L2415.4535,1055.5 L2405.4535,1045.5" fill="#E8F5E9" style="stroke:#F0A500;stroke-width:0.5;"/><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="130.0518" x="2247.37" y="1059.8428">Not implemented yet: Withdrawn</text><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="153.0835" x="2247.37" y="1071.1631">(a bot taking its own suggestion back).</text></g><g class="entity" data-qualified-name="GMN78" data-source-line="308" id="ent0079"><path d="M2450.37,1049.5 L2450.37,1074.1406 A4,4 0 0 0 2454.37,1078.1406 L2658.453,1078.1406 A4,4 0 0 0 2662.453,1074.1406 L2662.453,1055.5 L2652.453,1045.5 L2454.37,1045.5 A4,4 0 0 0 2450.37,1049.5" fill="#E8F5E9" style="stroke:#F0A500;stroke-width:0.5;"/><path d="M2652.453,1045.5 L2652.453,1053.5 A2,2 0 0 0 2654.453,1055.5 L2662.453,1055.5 L2652.453,1045.5" fill="#E8F5E9" style="stroke:#F0A500;stroke-width:1;"/><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="188.6177" x="2456.37" y="1059.8428">Not implemented yet (needs edit endpoints and</text><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="191.083" x="2456.37" y="1071.1631">suppliers first): NewSupply, UpdateSupplyPrice.</text></g><g class="entity" data-qualified-name="GMN81" data-source-line="313" id="ent0082"><path d="M2697.37,1044 L2697.37,1079.9609 A4,4 0 0 0 2701.37,1083.9609 L2944.9906,1083.9609 A4,4 0 0 0 2948.9906,1079.9609 L2948.9906,1050 L2938.9906,1040 L2701.37,1040 A4,4 0 0 0 2697.37,1044" fill="#E8F5E9" style="stroke:#F0A500;stroke-width:0.5;"/><path d="M2938.9906,1040 L2938.9906,1048 A2,2 0 0 0 2940.9906,1050 L2948.9906,1050 L2938.9906,1040" fill="#E8F5E9" style="stroke:#F0A500;stroke-width:1;"/><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="230.6206" x="2703.37" y="1054.3428">Not implemented yet: originalPayload (what the bot wrote,</text><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="184.1045" x="2703.37" y="1065.6631">while payload is what the reviewer edited) and</text><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="155.6016" x="2703.37" y="1076.9834">a link to the AgentRun that produced it.</text></g><g class="entity" data-qualified-name="GMN95" data-source-line="383" id="ent0096"><path d="M1620.87,732.5 L1620.87,768.4609 A4,4 0 0 0 1624.87,772.4609 L1843.4769,772.4609 A4,4 0 0 0 1847.4769,768.4609 L1847.4769,738.5 L1837.4769,728.5 L1624.87,728.5 A4,4 0 0 0 1620.87,732.5" fill="#FFFDE7" style="stroke:#F0A500;stroke-width:0.5;"/><path d="M1837.4769,728.5 L1837.4769,736.5 A2,2 0 0 0 1839.4769,738.5 L1847.4769,738.5 L1837.4769,728.5" fill="#FFFDE7" style="stroke:#F0A500;stroke-width:1;"/><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="194.1064" x="1626.87" y="742.8428">scopeEntityId points at the Culture, Procedure or</text><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="205.6069" x="1626.87" y="754.1631">Resource the question is about (scope says which).</text><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="178.8662" x="1626.87" y="765.4834">Free = a question about nothing in particular.</text></g><g class="entity" data-qualified-name="GMN98" data-source-line="389" id="ent0099"><path d="M1354.87,732.5 L1354.87,768.4609 A4,4 0 0 0 1358.87,772.4609 L1581.4891,772.4609 A4,4 0 0 0 1585.4891,768.4609 L1585.4891,738.5 L1575.4891,728.5 L1358.87,728.5 A4,4 0 0 0 1354.87,732.5" fill="#FFFDE7" style="stroke:#F0A500;stroke-width:0.5;"/><path d="M1575.4891,728.5 L1575.4891,736.5 A2,2 0 0 0 1577.4891,738.5 L1585.4891,738.5 L1575.4891,728.5" fill="#FFFDE7" style="stroke:#F0A500;stroke-width:1;"/><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing" textLength="193.1133" x="1360.87" y="742.8428">One row per bot job. Doubles as the work queue</text><text fill="#5D4037" font-family="sans-serif" font-size="9" lengthAdjust="spacing"